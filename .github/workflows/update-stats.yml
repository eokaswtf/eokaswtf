name: Update GitHub stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate stats card
        env:
          GITHUB_STATS_TOKEN: ${{ secrets.GITHUB_STATS_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_USER: eokaswtf
        run: python .github/scripts/generate_stats.py
      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update GitHub stats card"
          git push
